# Run everything:  docker compose up --build
# Needs trackflix-backend/.env (see .env.example) and trackflix-frontend/.env
services:
  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./trackflix-backend
    env_file: ./trackflix-backend/.env
    environment:
      MONGO_URI: mongodb://mongo:27017/Our_web_trackflix
      CORS_ORIGINS: http://localhost:8080
    ports:
      - "5000:5000"
    depends_on:
      - mongo

  frontend:
    build:
      context: ./trackflix-frontend
      args:
        VITE_API_BASE_URL: http://localhost:5000/api
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  mongo-data:
